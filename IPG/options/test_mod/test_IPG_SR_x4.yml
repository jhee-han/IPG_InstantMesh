name: inference_IPG_SR_x4
model_type: IPGModel
scale: 4  # Set the scale to 4 for 4x super-resolution
num_gpu: 1
manual_seed: 10

datasets:
  test:
    name: InferenceDataset
    type: SingleImageDataset
    dataroot_lq: /hdd/jhee/3D/IPG_InstantMesh/IPG/imgs # Make sure this is your correct input image path
    io_backend:
      type: disk

# network structures
network_g:
  type: IPG
  upscale: 4  # Set the upscale factor to 4
  in_chans: 3
  img_size: 64
  window_size: 16
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 4
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'
  graph_flags: [1, 1, 1, 1, 1, 1]
  stage_spec: [['GN','GS','GN','GS','GN','GS'],['GN','GS','GN','GS','GN','GS'],['GN','GS','GN','GS','GN','GS'],['GN','GS','GN','GS','GN','GS'],['GN','GS','GN','GS','GN','GS'],['GN','GS','GN','GS','GN','GS']]
  dist_type: 'cossim'
  top_k: 256
  head_wise: 0
  sample_size: 32
  graph_switch: 1
  flex_type: 'interdiff_plain'
  FFNtype: 'basic-dwconv3'
  conv_scale: 0.01
  conv_type: 'dwconv3-gelu-conv1-ca'
  diff_scales: [10,0,0,0,0,0]
  fast_graph: 1

# path
path:
  pretrain_network_g: /hdd/jhee/3D/IPG_InstantMesh/IPG/IPG_SRx4.pth  # Make sure this is your correct checkpoint path
  strict_load_g: false

# inference settings
val:
  save_img: true
  suffix: _inference_x4  # Suffix to indicate 4x super-resolution
  metrics: null  # Disable metric calculation
  # metrics:
  #   psnr: # metric name, can be arbitrary
  #     type: calculate_psnr
  #     crop_border: 4
  #     test_y_channel: true
  #   ssim:
  #     type: calculate_ssim
  #     crop_border: 4
  #     test_y_channel: true
